plugins { id 'com.android.application' }

android {
    namespace 'com.renaldibosco.noorbakery'
    compileSdk 34
    defaultConfig {
        applicationId 'com.renaldibosco.noorbakery'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        demo {
            storeFile file('noor-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.demo
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
